<!doctype html>
<!--
  Modelo da imagem de compartilhamento (assets/og-image.png).
  Para gerar de novo: abra este arquivo pelo servidor local, ative o modo
  responsivo do DevTools em 1200 × 630 e use "Capture screenshot".
-->
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <title>OG image</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..800&family=IBM+Plex+Mono:wght@400;500&display=swap">
    <link rel="stylesheet" href="../src/styles/tokens.css">
    <link rel="stylesheet" href="../src/styles/base.css">
    <style>
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }

      .og {
        display: grid;
        grid-template-rows: auto 1fr auto;
        height: 100%;
        padding: 56px 64px 52px;
      }

      .og__top,
      .og__bottom {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .og__bottom {
        padding-top: 20px;
        border-top: var(--rule-strong);
      }

      .og__brand {
        display: flex;
        align-items: center;
        gap: 12px;
        color: var(--color-ink);
      }

      .og__brand::before {
        content: "";
        width: 12px;
        height: 12px;
        background-color: var(--color-cobalt);
      }

      .og__name {
        align-self: center;
        font-size: 184px;
        font-weight: 800;
        font-stretch: var(--stretch-display);
        line-height: 0.84;
        letter-spacing: var(--tracking-display);
        text-transform: uppercase;
      }

      .og__name span {
        display: block;
      }

      .og__name span + span {
        padding-left: 270px;
      }

      .og__role {
        font-size: 30px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }

      .og__role b {
        color: var(--color-cobalt);
        font-weight: inherit;
      }

      .meta {
        font-size: 15px;
      }
    </style>
  </head>
  <body>
    <main class="og">
      <div class="og__top">
        <p class="og__brand meta">Portfólio</p>
        <p class="meta">Itu, SP — Brasil</p>
      </div>
      <h1 class="og__name"><span>Mateus</span><span>Chaves</span></h1>
      <div class="og__bottom">
        <p class="og__role" lang="en">Developer <b>/</b> Automation <b>/</b> Data</p>
        <p class="meta">mateusnchaves.github.io</p>
      </div>
    </main>
  </body>
</html>
